<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#120c1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nossa Jornada</title>
    <link rel="preload" href="assets/fonts/PixelifySans.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="stage"><div id="game"></div></div>
    <div id="touch" hidden></div>
    <div id="loading">
      <div class="load-heart" aria-hidden="true"></div>
      <p class="load-text">Carregando<span>.</span><span>.</span><span>.</span></p>
      <div class="load-bar"><div id="load-fill"></div></div>

    <div id="rotate">
      <div class="rotate-icon"></div>
      <p>Gire o celular para jogar deitado</p>
    </div>
    <script src="lib/phaser.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
